spring:
  application:
    name: product-description-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdesc}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES

langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:changeme}
      model-name: ${LLM_MODEL:gpt-4o-mini}
      # Structured output is gateway-agnostic by default: with no response-format, langchain4j appends
      # JSON-format instructions to the prompt and parses the text — works on any OpenAI-compatible endpoint.
      # Opt into OpenAI's json_schema mode only for endpoints that support it: LLM_RESPONSE_FORMAT=json_schema.
      response-format: ${LLM_RESPONSE_FORMAT:}
      strict-json-schema: ${LLM_STRICT_SCHEMA:false}
      temperature: 0.4
      log-requests: ${LLM_LOG:false}
      log-responses: ${LLM_LOG:false}

app:
  allegro:
    title:
      max-length: 75
  templates:
    embedding:
      dimension: 384          # must match the in-process embedding model + pgvector store
    retriever:
      max-results: 3          # top-K templates injected into generation
      min-score: 0.6          # similarity floor to avoid injecting weak matches
