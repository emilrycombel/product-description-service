openapi: 3.1.0
info:
  title: Product Description Service API
  version: 0.1.0
  description: >
    Generates, scores, templatizes, and SEO-optimizes eCommerce product content using LLMs.
    This contract is the source of truth for the HTTP API (see memory/constitution.md).
servers:
  - url: http://localhost:8080
    description: Local

paths:
  /api/v1/descriptions:generate:
    post:
      operationId: generateDescription
      summary: Generate a structured product description from mixed inputs
      description: >
        Produces a product description in Allegro's layout (an ordered list of sections, each with 1–2
        items: single text, single image, or text+image side by side) from supplier text, the user's own
        text, and/or product images. When an `externalId` is supplied the description is upserted against
        it (regenerating replaces the previous one) and can be retrieved via
        `GET /api/v1/products/{externalId}/description`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDescriptionRequest'
      responses:
        '200':
          description: Description generated and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDescriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/products/{externalId}/description:
    get:
      operationId: getProductDescription
      summary: Get the current stored description for a product (by external id)
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The product's current description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDescriptionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/descriptions/{id}:score:
    post:
      operationId: scoreStoredDescription
      summary: Score a stored product description (1–10) and persist the score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Description scored and score persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoredDescriptionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/descriptions:score:
    post:
      operationId: scoreAdHocDescription
      summary: Score an ad-hoc product description (1–10), nothing persisted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedDescription'
      responses:
        '200':
          description: Description scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionScore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/templates:
    post:
      operationId: createTemplate
      summary: Create a product-family template (persisted + indexed for RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listTemplates
      summary: List all templates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateResponse'

  /api/v1/templates/{id}:
    get:
      operationId: getTemplate
      summary: Get a template by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/templates:search:
    post:
      operationId: searchTemplates
      summary: Semantic search over templates (best match first)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTemplatesRequest'
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateMatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/allegro-titles:generate:
    post:
      operationId: generateAllegroTitle
      summary: Generate an Allegro search-optimized product title
      description: >
        Produces a keyword-first title tuned for Allegro search (brand + product type + model + key
        attributes), within the configured character limit, plus alternative variants and a rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAllegroTitleRequest'
      responses:
        '200':
          description: Title generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllegroTitle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamError'

components:
  responses:
    BadRequest:
      description: Invalid request (validation failure)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The model output was not a valid Allegro layout (see `violations`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No description exists for the given id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: The LLM gateway failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    GenerateDescriptionRequest:
      type: object
      required: [productName]
      properties:
        productName:
          type: string
          minLength: 1
          example: "Szkło hartowane Spigen GLAS.tR z aplikatorem do iPhone 16 Pro (2 szt.)"
        category:
          type: string
          example: "Szkła hartowane"
        brand:
          type: string
          example: "Spigen"
        language:
          type: string
          default: "pl"
          description: BCP-47-ish language tag for the generated copy
        supplierText:
          type: string
          description: Raw description text provided by a supplier
        userText:
          type: string
          description: The user's own notes/text
        externalId:
          type: string
          description: >
            The product id to save this description against. When present, the description is upserted
            (one per externalId) and retrievable via GET /api/v1/products/{externalId}/description.
          example: "SUPPLIER-SKU-12345"
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInput'

    ImageInput:
      type: object
      description: Exactly one of `url` or (`base64` + `mimeType`) must be provided.
      properties:
        url:
          type: string
          format: uri
        base64:
          type: string
          description: Base64-encoded image bytes
        mimeType:
          type: string
          example: "image/png"

    GenerateDescriptionResponse:
      type: object
      required: [id, modelName, structureVersion, createdAt, description]
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          nullable: true
          description: The product id this description is saved against, if any
        modelName:
          type: string
        structureVersion:
          type: string
          description: Canonical structure version of the description payload
        createdAt:
          type: string
          format: date-time
        description:
          $ref: '#/components/schemas/GeneratedDescription'

    GeneratedDescription:
      type: object
      description: >
        A product description in Allegro's layout: an ordered list of sections. Every valid description has
        at least one text item. Serializes directly to an Allegro description payload.
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DescriptionSection'

    DescriptionSection:
      type: object
      description: >
        An Allegro description row. Holds 1 item (full width) or 2 items shown side by side. A two-item
        section is exactly one TEXT and one IMAGE; array order sets the layout ([TEXT, IMAGE] = text left /
        image right; [IMAGE, TEXT] = image left / text right).
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/DescriptionItem'

    DescriptionItem:
      type: object
      description: >
        A single item within a section — either a TEXT item (HTML content) or an IMAGE item (a URL from the
        request). Exactly one of `content`/`url` is populated, per `type`.
      required: [type]
      properties:
        type:
          type: string
          enum: [TEXT, IMAGE]
        content:
          type: string
          description: >
            For TEXT items: HTML using only Allegro's allowed subset (h1, h2, p, ul, ol, li, b) with no
            attributes. A specification table is rendered as a <ul> of "Label: value" items.
          example: "<h1>Szkło hartowane Spigen GLAS.tR</h1><p>Najwyższa ochrona z powłoką 9H.</p>"
        url:
          type: string
          format: uri
          description: For IMAGE items: an image URL taken only from the request (never invented by the model).

    GenerateAllegroTitleRequest:
      type: object
      required: [productName]
      properties:
        productName:
          type: string
          minLength: 1
        brand:
          type: string
        category:
          type: string
        model:
          type: string
          description: Target product model/variant (e.g. "iPhone 16 Pro")
        keyAttributes:
          type: array
          description: Salient attributes to prioritize (e.g. "2-pack", "9H", "z aplikatorem")
          items:
            type: string
        language:
          type: string
          default: "pl"

    AllegroTitle:
      type: object
      required: [primary, variants, rationale, charCount]
      properties:
        primary:
          type: string
          description: The recommended title
        variants:
          type: array
          items:
            type: string
        rationale:
          type: string
          description: Why this title maximizes Allegro search visibility
        charCount:
          type: integer
          description: Character count of `primary`

    DescriptionScore:
      type: object
      description: Canonical, versioned quality assessment (1–10).
      required: [overall, dimensions, summary]
      properties:
        overall:
          type: number
          format: double
          minimum: 1
          maximum: 10
          description: Holistic 1.0–10.0 score, one decimal
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionScore'
        summary:
          type: string

    DimensionScore:
      type: object
      required: [dimension, score]
      properties:
        dimension:
          type: string
          description: One of COMPLETENESS, FAITHFULNESS, CLARITY, PERSUASIVENESS, SEO_ALLEGRO_FIT
        score:
          type: number
          format: double
          minimum: 1
          maximum: 10
        comment:
          type: string

    ScoredDescriptionResponse:
      type: object
      required: [id, rubricVersion, score]
      properties:
        id:
          type: string
          format: uuid
        rubricVersion:
          type: string
        score:
          $ref: '#/components/schemas/DescriptionScore'

    CreateTemplateRequest:
      type: object
      required: [name, family, body]
      properties:
        name:
          type: string
        family:
          type: string
          description: Product-family key (e.g. "phone-case")
        body:
          type: string
          description: Reusable guidance the LLM should follow for this family

    TemplateResponse:
      type: object
      required: [id, name, family, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        family:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    SearchTemplatesRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        maxResults:
          type: integer
          default: 5

    TemplateMatchResponse:
      type: object
      required: [score, template]
      properties:
        score:
          type: number
          format: double
        template:
          $ref: '#/components/schemas/TemplateResponse'

    Problem:
      type: object
      description: RFC 7807 problem details
      properties:
        type:
          type: string
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
